<!DOCTYPE html>
<html>
<head>
<title>SP-134 SOC Dashboard</title>
<style>
body { font-family: Arial; background: #0f172a; color: white; padding: 20px; }
.card { background: #1e293b; padding: 20px; border-radius: 10px; margin: 10px 0; }
h1 { color: #38bdf8; }
</style>
</head>
<body>
<h1>🛡️ SP-134 SOC Dashboard</h1>
<div class="card">
<h2>System Status: ONLINE</h2>
<p>Total Alerts: <span id="total">Loading...</span></p>
<p>Critical: <span id="critical">Loading...</span></p>
</div>
<div class="card" id="alerts">
<h2>Live Alerts</h2>
<p>Loading alerts...</p>
</div>
<script>
fetch('http://localhost:8000/alerts')
.then(r => r.json())
.then(data => {
  document.getElementById('total').innerText = data.length;
  document.getElementById('alerts').innerHTML = '<h2>Live Alerts</h2>' + data.map(a => `<p>${a.severity} - ${a.type} - ${a.src_ip}</p>`).join('');
});
</script>
</body>
</html>
